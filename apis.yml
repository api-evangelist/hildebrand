- aid: hildebrand:glowmarkt-device-management-system-api
  name: Glowmarkt Device Management System API
  description: >-
    Registration and status of the physical hardware feeding the platform — gateways such as the Glow
    CAD and GlowStick, sensors such as smart electricity meters, and actuators such as auxiliary load
    control switches. Also exposes the DCC inventory of a meter point by MPxN or by smart-meter EUI,
    the resources associated to a meter point, and gateway packet-delivery status.
  humanURL: https://api.glowmarkt.com/api-docs/v0-1/dmssys/
  baseURL: https://api.glowmarkt.com/api/v0-1
  tags:
  - Devices

    registry: pypi
    name: pyglowmarkt
    url: https://pypi.org/project/pyglowmarkt/
    install: pip install pyglowmarkt
    repository: https://github.com/cybermaggedon/pyglowmarkt
    license: GPL-3.0-or-later
    official: false
    note: Python client for the Bright/Glowmarkt/Hildebrand API; the most widely referenced community library.
  - language: rust
    registry: crates.io
    name: glowmarkt
    url: https://crates.io/crates/glowmarkt
    install: cargo add glowmarkt
    repository: https://github.com/Mossop/glowmarkt-rs
    official: false
    note: Crate for accessing the Glowmarkt API.

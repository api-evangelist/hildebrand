source: >-
  Registry searches on 2026-07-27 across npm, PyPI, crates.io, NuGet, RubyGems and GitHub code
  search for "glowmarkt" / "hildebrand glow", plus the provider's own surfaces
  (hildebrand.co.uk, glowmarkt.com, api.glowmarkt.com, data.glowforindustry.com) and the
  official individual-user PDF.
official_sdks: none
finding: >-
  Hildebrand publishes NO first-party client libraries in any language. The only public
  Hildebrand GitHub organisation (github.com/HildebrandTechnology) holds a single repository,
  a GitHub Pages placeholder last touched in 2014. What exists instead is a healthy
  third-party ecosystem built by Bright/Glow users against the public Swagger definitions —
  catalogued below with `official: false`. The official PDF itself points developers at a
  community resource (bitbucket.org/ijosh/brightglowmarkt) rather than an SDK of its own.
  Because no library is first-party, this repo deliberately does NOT carry an `SDKs` pointer.
packages: []
community_packages:

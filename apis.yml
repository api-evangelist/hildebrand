aid: hildebrand
url: https://raw.githubusercontent.com/api-evangelist/hildebrand/refs/heads/main/apis.yml
name: Hildebrand
kind: company
description: >-
  Hildebrand Technology Limited is a London-based energy data company and, since 2019, the United
  Kingdom's first independent DCC Other User with a direct connection to the Smart Data Communications
  Company network. It sits between Britain's mandated smart-metering infrastructure and the
  applications built on top of it: it makes Glow hardware (CADs, in-home displays, sub-meters,
  temperature sensors), ingests and stores smart-meter reads at scale, and republishes them through the
  Glowmarkt Platform APIs, the consumer Bright app, and the commercial Glow Data Service. Its API
  posture is an honest reflection of the British market seam — Britain mandated the metering
  INFRASTRUCTURE, not a consumer data right, so there is no Consumer Data Right or Green Button
  obligation on Hildebrand and no standards-conformant data-sharing surface to point at. What exists
  instead is a proprietary but genuinely well-documented platform: five public Swagger 2.0 definitions
  are served anonymously from api.glowmarkt.com/api-docs, and any individual who installs Bright,
  creates an account and passes meter-point verification can call the same production API for their own
  household data with a published applicationId. Third-party organisational access to other people's
  data is the closed half — it runs through Glow Data Service on a signed contract from GBP 595/month
  per MPxN, with consumer verification and consent captured per meter point. Hildebrand publishes no
  open grid or market data of any kind: every documented endpoint returns HTTP 400 without an
  applicationId header, so this is a closed-market-data, consent-gated-consumer-data provider.
deliveryModel:
  model: saas

- aid: hildebrand:glowmarkt-virtual-entity-system-api
  name: Glowmarkt Virtual Entity System API
  description: >-
    CRUD over Virtual Entities — the Glow Platform's model of a physical "thing" such as a home or a
    site, made up of metadata and a collection of resources. Lists the virtual entities a caller has
    access to, resolves the resources belonging to each, manages virtual entity types and metadata
    attributes, and reports per-application virtual entity statistics.
  humanURL: https://api.glowmarkt.com/api-docs/v0-1/vesys/
  baseURL: https://api.glowmarkt.com/api/v0-1
  tags:
  - Virtual Entities
  - Sites

method: derived
source: >-
  Derived from the definitions and id-reference fields in openapi/*.json (five Glowmarkt Swagger
  2.0 definitions) and the object descriptions in
  https://docs.glowmarkt.com/GlowmarktAPIDataRetrievalDocumentationIndividualUserForBright.pdf (v1.8).
docs: https://api.glowmarkt.com/api-docs/v0-1/resourcesys/
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field name; direction is
  from the entity that owns the reference. All ids are bare UUIDs — the Glow Platform uses no
  type-prefixed id scheme.
core_shape: >-
  Device -> Resource -> Virtual Entity. A Device is physical hardware (gateway, sensor, actuator);
  a Resource is one data stream produced by it, typed by a ResourceType and semantically labelled
  by a `classifier`; a Virtual Entity is the "thing" (a home, a site) that owns a collection of
  Resources. Everything is scoped by `applicationId` and owned by a user (`ownerId`).


  - type: APIReference
    url: https://api.glowmarkt.com/api-docs/v0-1/dmssys/
- aid: hildebrand:glowmarkt-notification-system-api
  name: Glowmarkt Notification System API
  description: >-
    Alerting and messaging for Glow-based applications. Defines alert types, manages per-channel and
    per-culture message templates, sends alerts to users, and reports notification delivery and logs.

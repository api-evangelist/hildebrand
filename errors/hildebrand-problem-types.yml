method: derived
source: >-
  Derived from the 4xx/5xx responses and error definitions in openapi/*.json (five Glowmarkt
  Swagger 2.0 definitions), plus live anonymous probes of api.glowmarkt.com/api/v0-1/* on
  2026-07-27.
format: proprietary
rfc9457: false
note: >-
  Glowmarkt does not use RFC 9457 problem+json. Every error is a flat JSON object whose single
  `error` property carries a human-readable string; there is no `type`, `title`, `status` or
  `instance` member and no stable machine-readable error code. Callers must switch on the message
  text. Hildebrand publishes no error-code reference page — this catalogue is derived entirely
  from the specs and from observed live responses.
envelope:
  media_type: application/json
  shape: '{"error": "<message>"}'
  enriched_variant: '{"status":"ERROR","error":"...","description":"...","<offendingField>":"<value>"}'
problems:
  - status: 400
    title: Missing elements
    schema: MissingElementsError
    example: '{"error":"missing elements"}'
    meaning: A required header, path parameter or body field was absent.
    remediation: >-
      Send both the `token` and `applicationId` headers and the full documented body. Anonymous
      calls to every documented endpoint return 400 — not 401 — because applicationId is missing.
    source_specs:
      - openapi/hildebrand-glowmarkt-user-system-swagger.json
      - openapi/hildebrand-glowmarkt-notification-system-swagger.json
      - openapi/hildebrand-glowmarkt-device-management-system-swagger.json
  - status: 400
    title: Missing elements - userId
    schema: missingUserIdError / FindResourceReqError
    example: '{"error":"missing elements -userId"}'
    meaning: The `userId` header was required for this operation and was not supplied.
    source_specs:
      - openapi/hildebrand-glowmarkt-resource-system-swagger.json
      - openapi/hildebrand-glowmarkt-device-management-system-swagger.json
  - status: 400
    title: Missing elements - applicationId
    schema: missingAppIdError
    example: '{"error":"missing elements -applicationId"}'

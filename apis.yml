- aid: hildebrand:glowmarkt-resource-system-api
  name: Glowmarkt Resource System API
  description: >-
    Time-series energy data retrieval. A resource is a single data stream — electricity consumption,
    electricity cost, gas consumption, gas cost, electricity export, reactive import/export — each
    carrying a classifier such as electricity.consumption or gas.consumption.cost. Exposes historical
    readings with ISO 8601 aggregation periods (PT1M through P1Y), current readings, first/last reading
    times, cumulative meter reads, the tariff applied to a cost resource and its history, a DCC catchup
    trigger, a DCC daily consumption log, and raw data in Hildebrand's Glow Binary format.
  humanURL: https://api.glowmarkt.com/api-docs/v0-1/resourcesys/
  baseURL: https://api.glowmarkt.com/api/v0-1
  tags:
  - Energy Data
  - Consumption
  - Tariffs
  - Time Series
  - Smart Metering
  - DCC
  properties:
  - type: OpenAPI
    url: openapi/hildebrand-glowmarkt-resource-system-swagger.json
  - type: Overlay
    url: overlays/hildebrand-glowmarkt-resource-system-overlay.yaml

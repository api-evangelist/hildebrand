classifiers:
  description: >-
    The `classifier` string on a Resource carries the data semantics — this is the platform's
    domain vocabulary and the closest thing Glow has to a data standard. Published verbatim in the
    individual-user PDF.
  values:
    - {classifier: electricity.consumption, unit: kWh, description: Electricity imported at a site.}
    - {classifier: electricity.consumption.cost, unit: pence, description: Cost of electricity imported at a site.}
    - {classifier: electricity.export, unit: kWh, description: Electricity exported from a site.}
    - {classifier: electricity.import.reactive, unit: kVARh, description: Reactive electricity imported; typically relevant for larger non-domestic sites.}
    - {classifier: electricity.export.reactive, unit: kVARh, description: Reactive electricity exported; typically relevant for large non-domestic sites.}
    - {classifier: gas.consumption, unit: kWh, description: Gas readings of a customer in energy units.}
    - {classifier: gas.consumption.cost, unit: pence, description: Gas readings of a customer in monetary units.}
  note: >-
    A dual-fuel household has four resources (electricity energy, electricity cost, gas energy,
    gas cost); an electricity-only household has two.

traversal:
  description: The canonical read path an integrator follows, all operationIds verified in the specs.
  steps:
    - {step: 1, operation: usernamelogin, note: 'POST /auth -> JWT (7-day expiry)'}
    - {step: 2, operation: virtualentity.findAll, note: 'GET /virtualentity -> veIds and their resource id pairs'}
    - {step: 3, operation: virtualentity.findResourcesbyVeId, note: 'GET /virtualentity/{id}/resources -> full resource documents incl. classifier and baseUnit'}
    - {step: 4, operation: resource.getReading, note: 'GET /resource/{id}/readings?from&to&period&offset&function -> [[ts, value], ...]'}
    - {step: 4b, operation: resource.getCurrentReading, note: 'GET /resource/{id}/current -> single latest pair'}

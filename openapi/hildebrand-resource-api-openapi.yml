          example: OK
        name:
          type: string
          example: electicity consumption
        resourceTypeId:
          type: string
          format: uuid
          example: f8e6fb07-6307-4e0e-8a17-4b94bc7249c2
        resourceId:
          type: string
          format: uuid
          example: 8f2a0722-3b59-47a6-a115-d43fcc0c5d1c
        classifier:
          type: string
          example: electricity.consumption
        data:
          type: array
          items:
            maxItems: 100
            type: array
            items:
              type: integer
    ResourceTypeReq:
      type: object
      properties:
        name:
          type: string
          example: electricity energy
        description:
          type: string
          example: The storage mechanism for saving electricity energy.
        classifier:
          type: string
          example: electricity.consumption
        storage:
          maxItems: 10
          type: array
          items:

apis:
- aid: hildebrand:glowmarkt-user-system-api
  name: Glowmarkt User System API
  description: >-
    User, account, authentication and consent management for the Glow Platform. Covers user
    registration, account profiles and sessions, JWT issuance via POST /auth, an OAuth 2.0
    authorization-code grant (POST /auth/oauth and POST /auth/oauth/access), and — the part that
    matters most in the British smart-metering context — Meter Point Consent and Verification, where
    consent to retrieve data is renewed and revoked per MPxN.
  humanURL: https://api.glowmarkt.com/api-docs/v0-1/usersys/usertypes/
  baseURL: https://api.glowmarkt.com/api/v0-1
  tags:
  - User
  - Account
  - Authentication
  - Consent
  - Meter Points
  tags_raw:
  - Users
  - Accounts
  - Authentication
  - OAuth
  - Consent
  - Meter Points

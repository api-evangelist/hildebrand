    name: willtomlinson/glowmarkt-php
    url: https://github.com/willtomlinson/glowmarkt-php
    official: false
    note: Simple PHP SDK for the Glowmarkt API. Source only, not on Packagist.
  - language: python
    registry: github
    name: TomBrien/glowmarkt-ha
    url: https://github.com/TomBrien/glowmarkt-ha
    official: false
    note: Python library written to be consumed by the Home Assistant Glowmarkt integration.
  - language: java
    registry: github
    name: rtuck99/openhab-binding
    url: https://github.com/rtuck99/openhab-binding
    official: false

apiFamily:
  segmentation: >-
    Hildebrand's docs segment by platform SYSTEM, not by energy product. The five systems are User
    (identity, auth, OAuth, per-MPxN consent), Virtual Entity (sites/homes and their data streams),
    Resource (the actual usage/metering, cost and tariff time series), Device Management (Glow hardware
    plus DCC meter-point inventory), and Notification (alerts and templates). Mapped onto the sector
    vocabulary: usage/metering and tariffs/pricing are the Resource System; DER/asset control and
    charging sessions are absent entirely; billing and payments exist as marketing claims under
    "Utility in a Box" (Payments System, Tariff Engine, Meter Balance) but have no published contract;
    emissions/carbon and market data are absent. Hardware sold alongside: Glow Electricity Meters,
    Aqua, Flux, Bridge Duo, Delta, Temperature Sensor, SAPC, IHD + CAD.
  applications:
  - name: Bright
    role: consumer mobile app (Android/iOS) and the free on-ramp to the Glowmarkt API for your own data
  - name: Connect
    role: field app for meter engineers — installation, pairing, firmware, commissioning
  - name: Glow Data Service
    role: contracted organisational access to customers' smart-meter data
  - name: Utility in a Box
    role: white-label modular utility stack (dashboard, support portal, developer portal, customer portal)

corporateFacts:
  legalName: Hildebrand Technology Limited
  secParty: true
  secPartyIdentifier: PLK001 (self-declared on hildebrand.co.uk footer)
  dccRole: Other User — confirmed "Yes - Other User" in the official SEC Parties List
  firstIndependentDccOtherUser: 2019, per https://www.hildebrand.co.uk/about timeline
  isoCertification: ISO 27001:2022, certificate number 10338-ISMS-001 (self-declared)
  icoRegistration: Z3161543 (self-declared)
  scaleClaims: 20+ years, 20+ clients, 300,000+ consumers, 25+ countries, "50 billion reads and growing" (homepage); "570 billion readings" (2019 timeline entry)
  namedCustomers: Energy Systems Catapult (Living Lab, 4,000+ households), Carbon Co-op (Power Shaper), Manx Utilities, Transport for London — per Hildebrand case studies

verdict:
  status: built
  summary: >-
    A real, capturable API surface behind a real regulatory status. Hildebrand is the counter-example to
    the sector's usual pattern: the mandate it lives under is genuine and verified in a public register,
    but that mandate is about network access, not data publication — so its APIs owe nothing to a
    standard and conform to none. Five Swagger 2.0 definitions covering 76 documented paths were
    harvested verbatim and saved. Consumer data is available and consent-managed per meter point;
    market data is nonexistent. Reading the contracts costs nothing; calling them costs either a Bright
    account (your own home only) or GBP 595/month on a signed contract (anyone else's).

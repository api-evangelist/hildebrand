standards:
  - id: oauth2
    conforms: partial
    evidence: >-
      The User System implements an OAuth 2.0 authorization-code grant — POST /auth/oauth
      (generateOAuthorizationCode) and POST /auth/oauth/access
      (exchangeAuthorizationCodeWithAccess, form-encoded, refresh_token supported). But no oauth2
      securityScheme is declared in any definition (the schemes are apiKey/basic), no scopes exist,
      there is no /authorize redirect endpoint documented for third-party clients, and no
      authorization-server metadata is published.
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: false
    evidence: /.well-known/oauth-authorization-server returns 404 on api.glowmarkt.com.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration returns 404; no id_token, no userinfo endpoint.
  - id: rfc6750-bearer-token
    conforms: false
    evidence: >-
      The JWT is carried in a bespoke `token` header, not in `Authorization: Bearer`, so the
      platform is JWT-based but not RFC 6750 conformant.
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Errors are flat proprietary JSON ({"error":"..."}); no application/problem+json anywhere. See errors/hildebrand-problem-types.yml.'
